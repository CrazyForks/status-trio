name: icon diagnostic
on: workflow_dispatch
permissions:
  contents: read
jobs:
  icon:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run icon test
        env:
          STATUS_TRIO_APP_ICON_ARTWORK_DIR: ${{ runner.temp }}/icon-artwork
        run: swift test --filter AppIconPreviewTests || true
      - name: Upload icon renders
        uses: actions/upload-artifact@v4
        with:
          name: icon-renders
          path: |
            Support/AppIcon.icon/Assets/*.png
            ${{ runner.temp }}/icon-artwork/*.png
